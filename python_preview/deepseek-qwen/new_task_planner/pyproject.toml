[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-planner"
version = "3.2.2"
description = "基于 LangGraph 与大语言模型的自主任务规划引擎，支持动态 DAG 编排、多模态意图识别与全流程可观测性评估（异步版）。"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "JiangDake", email = "dakeginger@qq.com" },
]
readme = "README.md"
keywords = ["llm-agent", "task-planning", "langgraph", "dag", "orchestration"]

dependencies = [
    # ── 核心 ──
    "langgraph>=1.2.11",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",

    # ── 配置（cog/loader.py 硬依赖 YAML）──
    "pyyaml>=6.0.0",

    # ── 数据库（同步驱动——适配 Dash WSGI 的 loop 特性）──
    # 详见 docs/ARCHITECTURE_FUTURE.md 的"关于异步边界"
    "pymongo>=4.5.0",

    # ── 流程图（Dash 前端 + 导出）──
    # ⚠️ dash[async] 必需——async 回调依赖 asgiref；
    #    否则抛 "You are trying to use a coroutine without dash[async]"
    "dash[async]>=4.4.0",
    "dash-cytoscape>=1.0.0",
    "plotly>=5.18.0",
    "networkx>=3.2",
    "pyvis>=0.3.2",
    "cairosvg>=2.7.0",
    "lxml>=5.0.0",
    "pydot>=3.0.0",
    "Pillow>=11.0.0",
    "wcwidth>=0.2.14",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
# 主要第三方llm提供商，可不装，仅在不使用OPENAI兼容时装
llms = [
   "dashscope>=1.20.0",
]
# ── 违禁词匹配加速（.py 里优雅降级，不装也能跑）──
words = [
    "pyahocorasick>=2.1.0",
]
# ── 高性能 JSON ──
orjson = [
    "orjson>=3.10.0",
]
# ── 配置工具增强（保留 YAML 注释）──
config-ui = [
    "ruamel.yaml>=0.18.0",
]
# ── Redis 会话存储（多 worker 部署）──
redis = [
    "redis>=5.0.0",
]
# --Mongodb asycino, 未来可能考虑全异步链路
db_extra = [
    "motor>=3.6.0",
]
# ── 评估套件依赖 ──
eval = [
    "python-Levenshtein>=0.25.0",   # 字符串相似度计算
]
# ── 开发依赖 ──
dev = [
    "pytest>=9.0.0",
    # ⚠️ pytest-asyncio 1.x 与 0.x 的配置语法不同
    #    （asyncio_default_fixture_loop_scope 等）
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "mypy>=1.13.0",
    "python-Levenshtein>=0.25.0",   # 评估套件需要
    "pyahocorasick>=2.1.0",         # 违禁词匹配性能测试需要
    "fakeredis>=2.20.0",            # Redis session store 测试用（无需真 Redis）
]
# --打包依赖 --
packer = [
    "pyinstaller>=5.0", # 显式指定依赖
    "unifypy>=2.0.0",  # 跨平台打包工具
    "unifypy[schema]>=2.0.0", # 验证合法性套件
]

[project.urls]
Homepage = "https://github.com/Duckherewegoo/task-planner"
Repository = "https://github.com/Duckherewegoo/task-planner"
Issues = "https://github.com/Duckherewegoo/task-planner/issues"

[project.scripts]
task-planner = "task_planner.main.ui.app:main"
task-planner-config = "task_planner.config_ui.app:main"
# ⚠️ 下面这条只在 `pip install -e .` 开发模式下有效（tests/ 不打包）
#task-planner-eval = "tests.eval_suite.run_evaluation:main"
# eval 工具通过 `pytest -m eval_live` 或 `python -m tests.eval_suite.run_evaluation` 调用，
# 不注册为 entry point（tests/ 不打包，注册后普通用户 pip install 会得到坏命令）


# ══════════════════════════════════════════════════
#  打包配置
# ══════════════════════════════════════════════════

[tool.setuptools.packages.find]
where = ["src"]
include = ["task_planner*"]
# 排除归档代码（不安装到 site-packages）
exclude = ["task_planner.abandon*"]

[tool.setuptools.package-data]
# ✅ prompts/ 下的 .txt 必须打包，否则 pip install 后运行时读不到
"task_planner.infrastructure.prompts" = ["*.txt"]
# ✅ assets 里的资源（如果未来加字体/图片）
"task_planner.main" = ["assets/*"]
# ✅ 配置工具若有静态资源（当前没有，占位）
"task_planner.config_ui" = ["*.txt", "*.yaml"]


# ══════════════════════════════════════════════════
#  工具链配置
# ══════════════════════════════════════════════════

[tool.black]
line-length = 100
# ⚠️ black 24.x 支持到 py313；black 25.x 起支持 py314。
#    如 `black --check` 报 "Invalid value for '--target-version'"，降为 py313。
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = [
    # ── 已有 ──
    "E501",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF022",

    # ── 新增 ──
    "RUF012",  # 类默认可变值——GoodAddons/_SingletonMeta 依赖此模式
    "RUF005",  # 列表拼接——`+` 比 `[*...]` 可读
    "UP047",   # PEP 695 泛型语法需 3.12+，good_addons 保持 3.10 兼容
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "E402"]   # E402：包的出口 import 顺序特殊
"src/task_planner/abandon/*" = ["ALL"]
"tests/**/*" = ["F401", "F811", "E501", "B008", "F841", "B905", "UP036"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
extraPaths = ["src", "tests"]
# ✅ 归档代码不检查（旧版本语法/缺依赖）
exclude = [
    "src/task_planner/abandon",
    "**/node_modules",
    "**/__pycache__",
    ".compat_removal_backup",
]
# ✅ 关掉"第三方库缺 stub"警告
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # 本项目代码的 warning 升级为 error——逼我们清理自家问题
    "error::DeprecationWarning:task_planner.*",
    "error::ResourceWarning:task_planner.*",
    # 第三方库的 warning 放行——不受我们控制
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:pymongo.*",
    "ignore::DeprecationWarning:dash.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::ResourceWarning:httpx.*",
]
# ✅ 默认排除 eval + integration：日常 pytest 只跑单元测试（快、免费）
#    跑 eval:        pytest -m eval_live
#    跑 integration: pytest -m integration
#    跑所有:         pytest -m "eval or integration or not (eval or integration)"
addopts = "-m 'not eval_live and not integration'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
    "eval: marks evaluation suite tests (REAL LLM by default, use USE_MOCK_LLM=true to skip)",
    "unit: marks pure unit tests (no I/O, no Agent, no DB)",
    "eval_live: 真实 LLM 评估（默认跳过，需 --eval-live）",
]

[tool.coverage.run]
source = ["task_planner"]
omit = ["*/tests/*", "*/abandon/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
