[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-planner"
version = "3.1.1"
description = "基于 LangGraph 与大语言模型的自主任务规划引擎，支持动态 DAG 编排、多模态意图识别与全流程可观测性评估（异步版）。"
requires-python = ">=3.14"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "JiangDake", email = "dakeginger@qq.com" },
]
readme = "README.md"
keywords = ["llm-agent", "task-planning", "langgraph", "dag", "orchestration"]

dependencies = [
    # ── 核心异步依赖 ──
    "langgraph>=1.2.11",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",

    # ── 配置（cog/loader.py 硬依赖 YAML）──
    "pyyaml>=6.0.0",

    # ── 数据库（异步驱动）──
    "motor>=3.6.0",
    "pymongo>=4.5.0",

    # ── 流程图（Dash 前端 + 导出）──
    "dash>=2.14.0",
    "dash-cytoscape>=0.3.0",
    "plotly>=5.18.0",
    "networkx>=3.2",
    "matplotlib>=3.8.0",
    "pyvis>=0.3.2",
    "cairosvg>=2.7.0",
    "lxml>=5.0.0",
    "pydot>=3.0.0",
    "Pillow>=11.0.0",
    "wcwidth>=0.2.14",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
# ── 违禁词匹配加速（.py 里优雅降级，不装也能跑）──
words = [
    "pyahocorasick>=2.1.0",
]
# ── LLM 提供商（可选，走 OpenAI 兼容模式时不需要）──
dashscope = [
    "dashscope>=1.20.0",
]
# ── 高性能 JSON ──
orjson = [
    "orjson>=3.10.0",
]
# ── 配置工具增强（保留 YAML 注释）──
config-ui = [
    "ruamel.yaml>=0.18.0",
]
# ── 评估套件依赖 ──
eval = [
    "python-Levenshtein>=0.25.0",   # 字符串相似度计算
]
# ── 开发依赖 ──
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "mypy>=1.13.0",
    "python-Levenshtein>=0.25.0",   # 评估套件需要
    "pyahocorasick>=2.1.0",         # 违禁词匹配性能测试需要
]

[project.urls]
Homepage = "https://github.com/Duckherewegoo/task-planner"
Repository = "https://github.com/Duckherewegoo/task-planner"
Issues = "https://github.com/Duckherewegoo/task-planner/issues"

[project.scripts]
task-planner = "task_planner.main.ui.app:main"
task-planner-config = "task_planner.config_ui.app:main"
# ⚠️ 下面这条只在 `pip install -e .` 开发模式下有效（tests/ 不打包）
task-planner-eval = "tests.eval_suite.run_evaluation:main"


# ══════════════════════════════════════════════════
#  打包配置
# ══════════════════════════════════════════════════

[tool.setuptools.packages.find]
where = ["src"]
include = ["task_planner*"]
# 排除归档代码（不安装到 site-packages）
exclude = ["task_planner.abandon*"]

[tool.setuptools.package-data]
# ✅ prompts/ 下的 .txt 必须打包，否则 pip install 后运行时读不到
"task_planner.infrastructure.prompts" = ["*.txt"]
# ✅ assets 里的资源（如果未来加字体/图片）
"task_planner.main" = ["assets/*"]
# ✅ 配置工具若有静态资源（当前没有，占位）
"task_planner.config_ui" = ["*.txt", "*.yaml"]


# ══════════════════════════════════════════════════
# 工具链配置
# ══════════════════════════════════════════════════

[tool.black]
line-length = 100
# ✅ 加上 py313（black 24+ 支持）
target-version = ["py314"]

[tool.ruff]
line-length = 100
# ✅ 从 py312 升到 py314
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = [
    # ── 已有 ──
    "E501",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF022",

    # ── 新增 ──
    "RUF012",  # 类默认可变值——GoodAddons/_SingletonMeta 依赖此模式
    "RUF005",   # 列表拼接——`+` 比 `[*...]` 可读
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "E402"]   # E402：包的出口 import 顺序特殊
"src/task_planner/abandon/*" = ["ALL"]
"tests/**/*" = ["F401", "F811", "E501", "B008", "F841", "B905", "UP036"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
extraPaths = ["src", "tests"]
# ✅ 归档代码不检查（旧版本语法/缺依赖）
exclude = [
    "src/task_planner/abandon",
    "**/node_modules",
    "**/__pycache__",
    ".compat_removal_backup",
]
# ✅ 关掉"第三方库缺 stub"警告
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ✅ 默认排除 eval marker：日常 pytest 只跑单元/集成测试（快、免费）
#    跑 eval 需要显式：pytest -m eval
addopts = "-v --tb=short -m 'not eval'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
    "eval: marks evaluation suite tests (REAL LLM by default, use USE_MOCK_LLM=true to skip)",
    "unit: marks pure unit tests (no I/O, no Agent, no DB)",
]

[tool.coverage.run]
source = ["task_planner"]
omit = ["*/tests/*", "*/abandon/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
