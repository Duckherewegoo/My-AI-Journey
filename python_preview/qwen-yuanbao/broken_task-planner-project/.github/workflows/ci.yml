# ============================================================
# Task Planner — GitHub Actions CI
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── 代码质量检查 ──────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check task_planner tests

      - name: Pyright check
        run: pyright task_planner

      - name: Black check
        run: black --check task_planner tests

  # ── 单元测试（Mock 模式，快速） ────────
  test-mock:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run mock tests
        env:
          USE_MOCK_LLM: "true"
        run: |
          pytest tests/ -v -m mock --cov=task_planner --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  # ── 集成测试（真实 LLM，需要密钥） ────
  test-real:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 shared-mime-info fonts-noto-cjk
          pip install -e ".[dev]"

      - name: Run integration tests
        env:
          USE_MOCK_LLM: "false"
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
        run: |
          pytest tests/ -v -m "integration or slow" --tb=short

      - name: Run Agent evaluation
        env:
          USE_MOCK_LLM: "false"
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
        run: |
          python -m tests.run_eval

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: tests/output/eval_report.md

  # ── Docker 构建测试 ──────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-planner:ci .

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-app \
            -e DASHSCOPE_API_KEY=dummy \
            -e USE_MOCK_LLM=true \
            -p 7860:7860 \
            task-planner:ci
          sleep 15
          curl -f http://localhost:7860/ || (docker logs test-app && exit 1)
          docker stop test-app
