# ============================================================
# Task Planner — Docker Compose
# ============================================================
version: "3.9"

services:
  # ── MongoDB ──────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: task_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Task Planner App ──────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_planner_app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "7860:7860"
    environment:
      # DashScope
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-}
      - DASHSCOPE_REGION=${DASHSCOPE_REGION:-cn-beijing}
      - USE_MOCK_LLM=${USE_MOCK_LLM:-false}

      # 模型
      - LLM_INTENT_MODEL=${LLM_INTENT_MODEL:-qwen3.7-flash-2026-07-15}
      - LLM_PLANNER_MODEL=${LLM_PLANNER_MODEL:-qwen3.7-flash-2026-07-15}
      - LLM_NODE_MODEL=${LLM_NODE_MODEL:-qwen3.7-flash-2026-07-15}

      # 超时/重试
      - LLM_TIMEOUT=${LLM_TIMEOUT:-120}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-3}
      - LLM_RETRY_BACKOFF=${LLM_RETRY_BACKOFF:-2}
      - LLM_TASK_TOTAL_TIMEOUT=${LLM_TASK_TOTAL_TIMEOUT:-300}
      - LLM_NODE_TIMEOUT=${LLM_NODE_TIMEOUT:-60}

      # MongoDB
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=${MONGO_DB:-task_planner_db}

      # Gradio
      - GRADIO_HOST=0.0.0.0
      - GRADIO_PORT=7860

      # 日志
      - DEBUG=${DEBUG:-true}
      - LOG_DIR=/app/logs
      - LOG_MAX_DAYS=${LOG_MAX_DAYS:-7}

      # 渲染
      - RENDER_DPI=${RENDER_DPI:-300}
      - RENDER_FONT=${RENDER_FONT:-Noto Sans CJK SC}
      - RENDER_WIDTH=${RENDER_WIDTH:-1200}
      - RENDER_HEIGHT=${RENDER_HEIGHT:-600}
    volumes:
      - app_logs:/app/logs
      - app_exports:/app/exports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

# ── 持久化卷 ──────────────────────────────
volumes:
  mongodb_data:
  app_logs:
  app_exports:
