# .github/workflows/eval-ci.yml
name: Task Planner Eval CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  mock-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Mock Evaluation (pytest)
        run: pytest tests/test_eval_suite_wrapper.py -v --tb=short --junitxml=eval-results.xml
      
      - name: Run Full Eval Report
        run: python -m eval_suite.run_evaluation --mock
      
      - name: Upload Eval Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.sha }}
          path: eval_reports/
      
      - name: Publish Test Results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: eval-results.xml
